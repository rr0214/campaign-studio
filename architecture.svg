<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6660"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A7F3C"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8613C"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E3B2E"/>
    </marker>
  </defs>

  <rect width="900" height="1240" fill="#FAF7F2"/>

  <!-- ── Title ───────────────────────────────────────────────────────── -->
  <text x="450" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#0B0F0D">Campaign Studio — verification pipeline</text>
  <text x="450" y="72" text-anchor="middle" font-size="13" fill="#6B7671">Control flow is fixed. No model chooses the next step — every branch is on data.</text>

  <!-- ── 1. RETRIEVE ─────────────────────────────────────────────────── -->
  <rect x="260" y="100" width="420" height="72" rx="14" fill="#F1EDE6" stroke="#DDD6C9"/>
  <text x="282" y="128" font-size="16" font-weight="700" fill="#0B0F0D">1 · RETRIEVE</text>
  <text x="282" y="150" font-size="12" fill="#3A4440">ChromaDB over the brand docs · top-k = 4</text>
  <text x="282" y="166" font-size="12" fill="#6B7671">Fresh every cycle. Nothing from a prior cycle reaches it.</text>
  <rect x="566" y="112" width="96" height="19" rx="9" fill="#0E3B2E"/>
  <text x="614" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#B8F24A">RETRIEVER</text>
  <text x="700" y="133" font-size="11" fill="#6B7671">plain function</text>
  <text x="700" y="149" font-size="11" font-weight="600" fill="#0E3B2E">no model call</text>

  <line x1="470" y1="172" x2="470" y2="200" stroke="#5B6660" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── 2. GENERATE ─────────────────────────────────────────────────── -->
  <rect x="260" y="202" width="420" height="82" rx="14" fill="#FFFFFF" stroke="#DDD6C9"/>
  <text x="282" y="230" font-size="16" font-weight="700" fill="#0B0F0D">2 · GENERATE</text>
  <text x="282" y="252" font-size="12" fill="#3A4440">Campaign copy — tagline, concept, messages, caption, tags</text>
  <text x="282" y="270" font-size="12" font-weight="600" fill="#0E3B2E">+ claims[] — every factual claim, each quoting its source</text>
  <rect x="612" y="214" width="50" height="19" rx="9" fill="#0E3B2E"/>
  <text x="637" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#B8F24A">LLM</text>
  <text x="700" y="243" font-size="11" fill="#6B7671">gpt-5.6-luna</text>

  <line x1="470" y1="284" x2="470" y2="312" stroke="#5B6660" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── 3. VERIFY ───────────────────────────────────────────────────── -->
  <rect x="260" y="314" width="420" height="196" rx="14" fill="#F6FBF7" stroke="#8FC5A5" stroke-width="1.5"/>
  <text x="282" y="342" font-size="16" font-weight="700" fill="#0B0F0D">3 · VERIFY — the guardrail</text>
  <rect x="578" y="326" width="84" height="19" rx="9" fill="#0E3B2E"/>
  <text x="620" y="339" text-anchor="middle" font-size="10" font-weight="700" fill="#B8F24A">GUARDRAIL</text>
  <text x="282" y="361" font-size="11.5" fill="#3A4440">Checks the copy against <tspan font-weight="700">the chunks actually retrieved</tspan> —</text>
  <text x="282" y="377" font-size="11.5" fill="#3A4440">not the whole corpus, so a retrieval miss is visible.</text>

  <rect x="282" y="388" width="376" height="48" rx="10" fill="#FFFFFF" stroke="#C9DED1"/>
  <text x="298" y="408" font-size="12.5" font-weight="700" fill="#0B0F0D">Layer 1 — deterministic</text>
  <text x="298" y="426" font-size="11" fill="#6B7671">prohibited phrase · unapproved statistic · competitor named</text>
  <rect x="560" y="396" width="84" height="17" rx="8" fill="#E7EFE9"/>
  <text x="602" y="408" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0E3B2E">TOOL · free</text>

  <line x1="470" y1="436" x2="470" y2="452" stroke="#5B6660" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="482" y="449" font-size="10" fill="#6B7671">only what layer 1 passes</text>

  <rect x="282" y="454" width="376" height="44" rx="10" fill="#FFFFFF" stroke="#C9DED1"/>
  <text x="298" y="474" font-size="12.5" font-weight="700" fill="#0B0F0D">Layer 2 — grounding judge</text>
  <text x="298" y="490" font-size="11" fill="#6B7671">unsupported · contradicted · scope broadened · reworded ban</text>
  <rect x="566" y="462" width="78" height="17" rx="8" fill="#E7EFE9"/>
  <text x="605" y="474" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0E3B2E">LLM · terra</text>

  <!-- fails → down the spine into repair -->
  <line x1="470" y1="510" x2="470" y2="540" stroke="#E8613C" stroke-width="1.9" marker-end="url(#arrowRed)"/>
  <text x="482" y="533" font-size="11.5" font-weight="700" fill="#E8613C">fails</text>

  <!-- passes → bypasses repair entirely, straight to route -->
  <path d="M 680 468 H 744 Q 762 468 762 486 V 755 Q 762 773 744 773 H 692"
        fill="none" stroke="#1A7F3C" stroke-width="1.9" marker-end="url(#arrowGreen)"/>
  <text x="778" y="620" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A7F3C" transform="rotate(90 778 620)">passes — skips 4 and 5</text>

  <!-- ── 4/5. REPAIR + RE-VERIFY (failure path) ──────────────────────── -->
  <rect x="260" y="546" width="420" height="72" rx="14" fill="#FDF7F3" stroke="#F0C9B4"/>
  <text x="282" y="574" font-size="16" font-weight="700" fill="#0B0F0D">4 · REPAIR <tspan font-size="11" font-weight="500" fill="#A2603F">— only on failure</tspan></text>
  <text x="282" y="596" font-size="12" fill="#3A4440">Rewrites against the source line the claim collided with.</text>
  <text x="282" y="612" font-size="12" font-weight="600" fill="#A2603F">One attempt. Hard cap — never a loop.</text>
  <rect x="612" y="558" width="50" height="19" rx="9" fill="#A2603F"/>
  <text x="637" y="571" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">LLM</text>

  <line x1="470" y1="618" x2="470" y2="646" stroke="#5B6660" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="260" y="648" width="420" height="62" rx="14" fill="#F6FBF7" stroke="#8FC5A5" stroke-width="1.5"/>
  <text x="282" y="676" font-size="16" font-weight="700" fill="#0B0F0D">5 · RE-VERIFY <tspan font-size="11" font-weight="500" fill="#4A7A5E">— only on failure</tspan></text>
  <text x="282" y="697" font-size="12" fill="#3A4440">The repair is checked too. Nothing is trusted for having been rewritten.</text>
  <rect x="578" y="660" width="84" height="19" rx="9" fill="#0E3B2E"/>
  <text x="620" y="673" text-anchor="middle" font-size="10" font-weight="700" fill="#B8F24A">GUARDRAIL</text>

  <line x1="470" y1="710" x2="470" y2="740" stroke="#5B6660" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── 6. ROUTE ────────────────────────────────────────────────────── -->
  <rect x="260" y="742" width="420" height="62" rx="14" fill="#FFFFFF" stroke="#DDD6C9"/>
  <text x="282" y="770" font-size="16" font-weight="700" fill="#0B0F0D">6 · ROUTE</text>
  <text x="282" y="791" font-size="12" fill="#3A4440">Plain function. Three outcomes — no model involved.</text>
  <rect x="602" y="754" width="60" height="19" rx="9" fill="#0E3B2E"/>
  <text x="632" y="767" text-anchor="middle" font-size="10" font-weight="700" fill="#B8F24A">CHAIN</text>

  <line x1="370" y1="804" x2="370" y2="824" stroke="#5B6660" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="470" y1="804" x2="470" y2="824" stroke="#5B6660" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="570" y1="804" x2="570" y2="824" stroke="#5B6660" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- three outcomes -->
  <rect x="150" y="826" width="210" height="70" rx="12" fill="#EAF7EE" stroke="#8FC5A5"/>
  <text x="166" y="848" font-size="12.5" font-weight="700" fill="#14532D">Published</text>
  <text x="166" y="866" font-size="10.5" fill="#3A4440">No review needed.</text>
  <text x="166" y="882" font-size="10.5" fill="#3A4440">Receipts attached.</text>

  <rect x="368" y="826" width="204" height="70" rx="12" fill="#EEF2FD" stroke="#9BAEEA"/>
  <text x="384" y="848" font-size="12.5" font-weight="700" fill="#1E3A8A">Published · audit sample</text>
  <text x="384" y="866" font-size="10.5" fill="#3A4440">Randomly selected.</text>
  <text x="384" y="882" font-size="10.5" font-weight="600" fill="#1E3A8A">Nothing was wrong. Still ships.</text>

  <rect x="580" y="826" width="180" height="70" rx="12" fill="#FDEEE9" stroke="#EDA98C"/>
  <text x="596" y="848" font-size="12.5" font-weight="700" fill="#7F1D1D">Human review</text>
  <text x="596" y="866" font-size="10.5" fill="#3A4440">Nothing published.</text>
  <text x="596" y="882" font-size="10.5" fill="#3A4440">Reviewer sees both drafts.</text>

  <path d="M 255 896 V 918 H 470" fill="none" stroke="#5B6660" stroke-width="1.4"/>
  <path d="M 470 896 V 918" fill="none" stroke="#5B6660" stroke-width="1.4"/>
  <line x1="470" y1="918" x2="470" y2="940" stroke="#5B6660" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="482" y="935" font-size="10" fill="#6B7671">only when it publishes</text>

  <!-- ── 7. ASSETS ───────────────────────────────────────────────────── -->
  <rect x="260" y="942" width="420" height="66" rx="14" fill="#FFFFFF" stroke="#DDD6C9"/>
  <text x="282" y="970" font-size="16" font-weight="700" fill="#0B0F0D">7 · ASSETS</text>
  <text x="282" y="991" font-size="12" fill="#3A4440">5-second video. Concept words never reach the model; the shot needs a turn.</text>
  <rect x="602" y="954" width="60" height="19" rx="9" fill="#0E3B2E"/>
  <text x="632" y="967" text-anchor="middle" font-size="10" font-weight="700" fill="#B8F24A">TOOL</text>
  <text x="700" y="984" font-size="11" fill="#6B7671">veo-3.1-lite</text>

  <line x1="470" y1="1008" x2="470" y2="1032" stroke="#5B6660" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── 8. AUDIENCE ─────────────────────────────────────────────────── -->
  <rect x="260" y="1034" width="420" height="72" rx="14" fill="#FFFFFF" stroke="#B9B2A6" stroke-dasharray="5 4"/>
  <text x="282" y="1062" font-size="16" font-weight="700" fill="#0B0F0D">8 · AUDIENCE <tspan font-size="11" font-weight="500" fill="#8A8377">— series only</tspan></text>
  <text x="282" y="1083" font-size="12" font-weight="700" fill="#A2603F">SIMULATED — no real audience, no engagement data.</text>
  <text x="282" y="1099" font-size="11.5" fill="#3A4440">Three comments on what published. Accurate early, over-reaching later.</text>
  <rect x="612" y="1046" width="50" height="19" rx="9" fill="#8A8377"/>
  <text x="637" y="1059" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">LLM</text>

  <!-- ── Series feedback loop ────────────────────────────────────────── -->
  <path d="M 260 1070 H 120 Q 100 1070 100 1050 V 263 Q 100 243 120 243 H 252"
        fill="none" stroke="#0E3B2E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
  <text x="78" y="660" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3B2E" transform="rotate(-90 78 660)">NEXT CYCLE INHERITS</text>
  <text x="58" y="660" text-anchor="middle" font-size="10.5" fill="#3A4440" transform="rotate(-90 58 660)">approved copy · comments · corrections + source lines</text>

  <!-- ── Footer: cost + trace ────────────────────────────────────────── -->
  <rect x="100" y="1140" width="700" height="66" rx="14" fill="#0E3B2E"/>
  <text x="124" y="1166" font-size="12.5" font-weight="700" fill="#B8F24A">Every step is traced and costed</text>
  <text x="124" y="1186" font-size="11.5" fill="#E4EDE7">Tokens and USD sit on each span; the total on the root. Each step resolves to</text>
  <text x="124" y="1200" font-size="11.5" fill="#E4EDE7">known · free · unknown — an unmeasured call is never reported as $0.00.</text>
</svg>
